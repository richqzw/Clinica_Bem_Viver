
name: Publicar Clínica Bem Viver

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Testar Flask e SQLite
        working-directory: py
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests

      - name: Preparar arquivos do site
        run: |
          node --check docs/static/js/pages.js
          node --check docs/static/js/api.js
          node --check docs/static/js/clinica.js
          mkdir -p _site/docs
          cp index.html _site/
          cp -r docs/static docs/dados _site/docs/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
